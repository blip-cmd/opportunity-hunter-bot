name: Scholar Hunt

# SECURITY: this repo is public. Never add pull_request_target, never echo
# secrets, never print hunt output. Full logs are written to the PRIVATE repo.
on:
  schedule:
    - cron: "0 7 * * 0"   # Sundays, 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email, no state or tracker changes; only the private log is saved)"
        type: boolean
        default: false

permissions:
  contents: read   # this public repo is never written to

concurrency:
  group: hunt      # shared by both hunters so they never push to the private repo at once
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out runner code (public)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: runner
          persist-credentials: false

      - name: Check out data repo (private)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: private

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install pinned, hash-checked dependencies
        run: pip install --require-hashes --no-deps -r runner/requirements.lock

      - name: Put runner code into the private checkout
        run: |
          rm -rf private/search/jobhunt && cp -r runner/jobhunt private/search/jobhunt
          mkdir -p private/search/scholarhunt
          cp runner/scholarhunt/*.py private/search/scholarhunt/   # keeps the private state/ folder

      - name: Run hunt (output stays private)
        working-directory: private/search
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}   # integration sees one shared page; writes only Bot: columns and empty fields
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # optional repo variable; empty means the code default
          DRY: ${{ inputs.dry_run }}
        run: |
          mkdir -p logs
          suffix=""; [ "$DRY" = "true" ] && suffix="-cloud-dry"
          log="logs/scholarhunt-$(date -u +%F)${suffix}.log"
          flag=""; [ "$DRY" = "true" ] && flag="--dry-run"
          set +e
          python -m scholarhunt.run $flag > "$log" 2>&1
          code=$?
          set -e
          # Counts only. Titles, scores and reasons never reach this public log.
          echo "exit=$code; lines logged=$(wc -l < "$log"); full log saved privately"
          grep -oE '^Done\. .*' "$log" | sed -E 's/[^0-9|:+ a-zA-Z.-]//g' || true
          exit $code

      - name: Save results to the private repo
        if: ${{ always() }}
        working-directory: private
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DRY" = "true" ]; then
            # Dry runs keep only their log, so the result can be read without sending anything.
            git add search/logs/*-cloud-dry.log 2>/dev/null || true
            what="dry run"
          else
            git add APPLICATIONS_TRACKER.csv SCHOLARSHIPS_TRACKER.csv search/state search/digests search/scholarhunt/state search/logs 2>/dev/null || true
            what="run"
          fi
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -q -m "chore: scholarhunt $what $(date -u +%F) [skip ci]"
            git pull -q --rebase --autostash   # copied runner code is left unstaged on purpose
            git push -q
            echo "Saved."
          fi
